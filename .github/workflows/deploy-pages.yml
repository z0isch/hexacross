name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  USAGI_VERSION: v1.3.3

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Usagi
        run: |
          curl -fsSL https://usagiengine.com/install.sh | sh -s -- "$USAGI_VERSION"
          echo "$HOME/.usagi/bin" >> "$GITHUB_PATH"

      - name: Export web build
        run: |
          usagi export --target web -o web.zip
          unzip -q web.zip -d site
          ls -la site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
